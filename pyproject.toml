[project]
name = "handle-mcp"
version = "0.10.0"
description = "MCP-server til nemlig.com og BilkaToGo: søg, sammenlign og fyld kurven. Du betaler altid selv."
readme = "README.md"
license = "MIT"
authors = [{ name = "Julius Torp Larsen" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "tzdata>=2024.1; sys_platform == 'win32'",  # tidszoner (Europe/Copenhagen) findes ikke i Windows
]

[project.scripts]
handle-mcp = "handle_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handle_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
